name: Desplegar sitio estatico a GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama asi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Especifica la carpeta raíz o la carpeta de salida (ej. ./dist o ./build)

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
